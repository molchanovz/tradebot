name: Deploy

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]
  # ручной передеплой текущего devel из вкладки Actions
  workflow_dispatch:

jobs:

  # Тесты без -short ходят в реальные API маркетплейсов и в локальную БД
  # (cfg/local.toml), поэтому в CI только короткие; пакеты с TestMain без
  # конфига пропускают свои тесты сами.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build
      run: make build

    - name: Tests
      run: make test-short

  # Собираем образ ПРЯМО на сервере и рестартуем ТОЛЬКО бота: db не трогаем
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/devel'
    concurrency:
      group: deploy-tradebot
      cancel-in-progress: false
    steps:
    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}   # пусто → 22
        command_timeout: 20m
        script: |
          set -e   # appleboy/ssh-action@v1 не знает script_stop — стопим сами
          cd ${{ secrets.DEPLOY_PATH }}
          # обновляем исходники+compose из репо; cfg/local.toml, .env и ключи Google
          # в .gitignore — reset их не трогает, Dockerfile берёт их из этой папки
          git fetch --prune origin devel
          git reset --hard origin/devel
          docker compose build bot
          docker compose up -d --no-deps bot
          docker image prune -f

          # бот поднялся, если /status отвечает изнутри контейнера
          for i in $(seq 1 20); do
            if docker compose exec -T bot curl -fsS http://localhost:8075/status >/dev/null 2>&1; then
              echo "tradebot is up: $(git log -1 --format='%h %s')"
              exit 0
            fi
            sleep 3
          done
          echo "tradebot did not answer /status in 60s"
          docker compose ps bot
          docker compose logs --tail=100 bot
          exit 1
